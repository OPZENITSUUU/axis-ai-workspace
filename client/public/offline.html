<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060914" />
    <title>AXIS — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #060914; color: #f5f7fb; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 430px); border: 1px solid rgba(147, 193, 221, .16); border-radius: 24px; padding: 28px; background: rgba(17, 26, 42, .78); box-shadow: 0 24px 72px rgba(0, 0, 0, .32); }
      .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #061017; background: #85dfb9; font-weight: 800; }
      h1 { margin: 24px 0 10px; font-size: 28px; letter-spacing: -.04em; } p { margin: 0; color: #aab6c6; line-height: 1.6; } button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 16px; color: #061017; background: #85dfb9; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">✦</div>
      <h1>AXIS is offline</h1>
      <p>Reconnect to load your private workspace. AXIS never shows cached chat content on this fallback screen.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
